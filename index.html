<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sachet stérile</title>
<style>
  :root { --fond:#f1f5f4; --texte:#0f2a29; --teal:#0d9488; --gris:#64748b; --carte:#fff; }
  @media (prefers-color-scheme: dark) { :root { --fond:#0f1a1a; --texte:#e6f2f1; --carte:#18292a; --gris:#94a3b8; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--fond); color:var(--texte); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:420px; background:var(--carte); border-radius:16px; padding:22px; box-shadow:0 2px 14px rgba(0,0,0,.12); text-align:center; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { color:var(--gris); line-height:1.5; margin:8px 0; }
  button { display:block; width:100%; margin-top:12px; padding:16px; border:none; border-radius:12px; background:var(--teal); color:#fff; font-size:17px; font-weight:700; }
  button.sec { background:transparent; color:var(--gris); font-size:14px; font-weight:600; padding:10px; }
  .code { font-weight:700; color:var(--texte); word-break:break-all; }
</style>
</head>
<body>
<main>
  <h1>📦 Sachet stérile</h1>
  <p>Sachet : <span class="code" id="code">—</span></p>
  <div id="zone"></div>
</main>
<script>
// ── À modifier seulement si l'adresse d'un PC change (réservation d'adresse dans la box) ──
var OPERATEURS = {
  "Guillaume": "http://192.168.1.112:8080",
  "Célia":     "http://192.168.1.91:8081"
};
var CLE = "podica_operateur_relais";

var codeSachet = new URLSearchParams(location.search).get("code") || "";
document.getElementById("code").textContent = codeSachet || "(aucun)";
var zone = document.getElementById("zone"), minuteur = null;

function lire(){ try { return localStorage.getItem(CLE) || ""; } catch (e) { return ""; } }
function ecrire(v){ try { localStorage.setItem(CLE, v); } catch (e) {} }
function effacer(){ try { localStorage.removeItem(CLE); } catch (e) {} }

function aller(op){
  location.replace(OPERATEURS[op] + "/sterilisation/sachet?code=" + encodeURIComponent(codeSachet));
}
function choisir(){
  clearTimeout(minuteur);
  zone.innerHTML = "<p>Qui utilise ce téléphone ?<br>(demandé une seule fois)</p>";
  Object.keys(OPERATEURS).forEach(function(op){
    var b = document.createElement("button"); b.type = "button"; b.textContent = op;
    b.onclick = function(){ ecrire(op); aller(op); };
    zone.appendChild(b);
  });
}
function ouvrir(op){
  zone.innerHTML = "<p>Ouverture sur le PC de <b></b>…</p>";
  zone.querySelector("b").textContent = op;
  var b = document.createElement("button"); b.type = "button"; b.className = "sec"; b.textContent = "Ce n'est pas moi";
  b.onclick = function(){ effacer(); choisir(); };
  zone.appendChild(b);
  minuteur = setTimeout(function(){ aller(op); }, 1200);
}

if (!codeSachet) { zone.innerHTML = "<p>Aucun numéro de sachet dans ce QR code.</p>"; }
else {
  var op = lire();
  if (op && OPERATEURS[op]) ouvrir(op); else choisir();
}
</script>
</body>
</html>
